global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: talvix-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:5000/api/v1/health
          - http://frontend/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
